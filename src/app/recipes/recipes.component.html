<div>
    <h1>Recipes</h1>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Difficulty</th>
          <th>Rating</th>
          <th>Cuisine</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let recipe of recipes">
          <td>{{ recipe.id }}</td>
          <td>{{ recipe.name }}</td>
          <td>{{ recipe.difficulty }}</td>
          <td>{{ recipe.rating }}</td>
          <td>{{ recipe.cuisine }}</td>
          <td>
            <button (click)="viewRecipe(recipe.id)">Megtekintés</button>
            <button (click)="editRecipe(recipe.id)">Szerkesztés</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
